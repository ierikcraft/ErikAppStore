<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zapp Store ⚡ Minecraft Descarga</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-base: #06070f;
      --card-bg: rgba(16, 19, 38, 0.85);
      --border-subtle: rgba(139, 92, 246, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --gradient-zapp: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #06b6d4 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background-image: radial-gradient(circle at 50% 25%, rgba(139, 92, 246, 0.2), transparent 55%);
    }

    .card {
      max-width: 480px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 26px;
      padding: 36px 26px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    }

    .card img {
      width: 92px;
      height: 92px;
      border-radius: 22px;
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px;
      margin-bottom: 8px;
    }

    p {
      color: var(--text-muted);
      font-size: 14.5px;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 22px;
      border-radius: 14px;
      background: var(--gradient-zapp);
      color: #ffffff;
      font-weight: 800;
      text-decoration: none;
      margin-bottom: 12px;
    }

    .btn-secondary {
      display: inline-block;
      color: var(--text-muted);
      font-size: 13.5px;
      text-decoration: none;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <div class="card">
    <img src="https://cdn.glitch.global/22db19f6-a3d5-4c98-9b1a-836a8b7e2db2/Minecraft.png?v=1727295741216"
      alt="Minecraft">
    <h1>Minecraft en Zapp Store</h1>
    <p>433 — Pasarela con anuncios en mantenimiento. Puedes acceder a la descarga directa desde nuestro servidor
      Zapp Cloud.</p>
    <a href="https://drive.google.com/file/d/17u8b3_Zfe60nzVpyHm9ChKJD9dlFr5ET/view?usp=sharing" class="btn"
      target="_blank"><i class="fa-solid fa-bolt"></i> Descargar Minecraft Directo</a>
    <a href="../inicio.html" class="btn-secondary"><i class="fa-solid fa-arrow-left"></i> Volver a Zapp Store</a>
  </div>
</body>

</html>
