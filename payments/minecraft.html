<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiwi Store — Minecraft Descarga</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-color: #070b08;
      --card-bg: rgba(18, 28, 21, 0.85);
      --card-border: rgba(163, 230, 53, 0.24);
      --text-main: #f4f9f4;
      --text-muted: #93a898;
      --accent: #a3e635;
      --accent-dark: #071209;
      --gradient-kiwi: linear-gradient(135deg, #a3e635 0%, #22c55e 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background-image: radial-gradient(circle at 50% 25%, rgba(163, 230, 53, 0.18), transparent 55%);
    }

    .card {
      max-width: 480px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 26px;
      padding: 36px 26px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .card img {
      width: 92px;
      height: 92px;
      border-radius: 22px;
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      margin-bottom: 8px;
    }

    p {
      color: var(--text-muted);
      font-size: 14.5px;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 22px;
      border-radius: 99px;
      background: var(--gradient-kiwi);
      color: var(--accent-dark);
      font-weight: 800;
      text-decoration: none;
      margin-bottom: 12px;
    }

    .btn-secondary {
      display: inline-block;
      color: var(--text-muted);
      font-size: 13.5px;
      text-decoration: none;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <div class="card">
    <img src="https://cdn.glitch.global/22db19f6-a3d5-4c98-9b1a-836a8b7e2db2/Minecraft.png?v=1727295741216"
      alt="Minecraft">
    <h1>Minecraft en Kiwi Store</h1>
    <p>433 — Pasarela con anuncios en mantenimiento. Puedes acceder a la descarga directa desde nuestro servidor
      alternativo.</p>
    <a href="https://drive.google.com/file/d/17u8b3_Zfe60nzVpyHm9ChKJD9dlFr5ET/view?usp=sharing" class="btn"
      target="_blank"><i class="fa-solid fa-download"></i> Descargar Minecraft Directo</a>
    <a href="../inicio.html" class="btn-secondary"><i class="fa-solid fa-arrow-left"></i> Volver a Kiwi Store</a>
  </div>
</body>

</html>
