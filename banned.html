<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zapp Store ⚡ Acceso Restringido</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #09060d;
      color: #f9f4f4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background-image: radial-gradient(circle at 50% 25%, rgba(239, 68, 68, 0.22), transparent 55%);
    }

    .ban-card {
      max-width: 500px;
      width: 100%;
      background: rgba(28, 16, 24, 0.85);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 26px;
      padding: 38px 26px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
    }

    .icon-ban {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: rgba(239, 68, 68, 0.18);
      color: #f87171;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 16px;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px;
      margin-bottom: 10px;
      color: #fca5a5;
    }

    p {
      color: #b89c9c;
      font-size: 14.5px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="ban-card">
    <div class="icon-ban"><i class="fa-solid fa-shield-virus"></i></div>
    <h1>454 — Acceso Suspendido en Zapp Store</h1>
    <p>Tu cuenta o dispositivo ha sido restringido por el sistema de seguridad Zapp Shield.</p>
  </div>

  <script>
    window.onload = function () {
      let banned = localStorage.getItem("banned");
      if (banned !== "true") {
        localStorage.setItem("banned", "true");
      }
    };

    setTimeout(function () {
      window.location.href = 'https://erikserver.com/offload/error/banned/lockacces/';
    }, 20000);

    document.body.addEventListener('click', function () {
      window.location.href = 'https://erikserver.com/offload/error/banned/lockacces/';
    });

    document.body.addEventListener('touchstart', function () {
      window.location.href = 'https://erikserver.com/offload/error/banned/lockacces/';
    });
  </script>
</body>

</html>
