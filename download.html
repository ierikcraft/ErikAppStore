<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070b08">
  <title>Descargar Kiwi Store — iOS &amp; Android</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-color: #070b08;
      --card-bg: rgba(18, 28, 21, 0.82);
      --card-border: rgba(163, 230, 53, 0.22);
      --text-main: #f4f9f4;
      --text-muted: #93a898;
      --accent: #a3e635;
      --accent-dark: #071209;
      --gradient-kiwi: linear-gradient(135deg, #a3e635 0%, #22c55e 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background-image: radial-gradient(circle at 50% 20%, rgba(163, 230, 53, 0.2), transparent 55%);
    }

    .download-card {
      max-width: 540px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(16px);
    }

    .logo-badge {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: var(--gradient-kiwi);
      color: var(--accent-dark);
      font-size: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      box-shadow: 0 10px 28px rgba(163, 230, 53, 0.35);
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    h1 span {
      background: var(--gradient-kiwi);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .buttons-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .boton {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 18px 24px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 18px;
      cursor: pointer;
      text-decoration: none;
      gap: 12px;
      transition: all 0.25s ease;
    }

    .android {
      background: var(--gradient-kiwi);
      color: var(--accent-dark);
      box-shadow: 0 8px 24px rgba(163, 230, 53, 0.3);
    }

    .android:hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
    }

    .apple {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .apple:hover {
      background: rgba(255, 255, 255, 0.14);
      transform: translateY(-2px);
    }

    .back-web {
      display: inline-block;
      margin-top: 22px;
      font-size: 14px;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
    }

    .back-web:hover {
      color: var(--accent);
    }
  </style>
</head>

<body>
  <div class="download-card">
    <div class="logo-badge"><i class="fa-solid fa-seedling"></i></div>
    <h1>Instala <span>Kiwi Store</span></h1>
    <p>Lleva todo el catálogo de Kiwi Store directamente en la pantalla de inicio de tu móvil o tablet.</p>

    <div class="buttons-stack">
      <a href="https://www.dropbox.com/scl/fi/yyfa4j4gs5ar47dxa2m1c/ErikAppStore.apk?rlkey=9ak39xis6gjgxapscf461sbwc&st=fct0nvbs&dl=1"
        class="boton android">
        <i class="fa-brands fa-android" style="font-size: 24px;"></i>
        Descargar para Android (APK)
      </a>

      <a href="https://www.dropbox.com/scl/fi/cinqkbqbs6pb9t0gfz28y/INSTALAR-ERIK-APP-STORE-EN-IPHONE-O-IPAD.pdf?rlkey=7k76zzjt76u3b8epu60y40zg2&st=bhjjodl6&dl=1"
        class="boton apple">
        <i class="fa-brands fa-apple" style="font-size: 24px;"></i>
        Guía de Instalación iOS (iPhone / iPad)
      </a>
    </div>

    <a href="inicio.html" class="back-web"><i class="fa-solid fa-globe"></i> Continuar en Kiwi Store Web</a>
  </div>
</body>

</html>
