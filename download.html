<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#06070f">
  <title>Descargar Zapp Store ⚡ iOS &amp; Android</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-base: #06070f;
      --card-bg: rgba(16, 19, 38, 0.85);
      --border-subtle: rgba(139, 92, 246, 0.28);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --zapp-cyan: #38bdf8;
      --gradient-zapp: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #06b6d4 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background-image: radial-gradient(circle at 50% 20%, rgba(139, 92, 246, 0.24), transparent 55%);
    }

    .download-card {
      max-width: 540px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 28px;
      padding: 38px 28px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(16px);
    }

    .logo-badge {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: var(--gradient-zapp);
      color: #ffffff;
      font-size: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      box-shadow: 0 10px 28px rgba(99, 102, 241, 0.45);
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    h1 span {
      background: linear-gradient(90deg, #38bdf8, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .buttons-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .boton {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 18px 24px;
      font-size: 17px;
      font-weight: 700;
      border-radius: 16px;
      cursor: pointer;
      text-decoration: none;
      gap: 12px;
      transition: all 0.25s ease;
    }

    .android {
      background: var(--gradient-zapp);
      color: #ffffff;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
    }

    .android:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .apple {
      background: rgba(255, 255, 255, 0.07);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .apple:hover {
      background: rgba(255, 255, 255, 0.13);
      transform: translateY(-2px);
    }

    .back-web {
      display: inline-block;
      margin-top: 22px;
      font-size: 14px;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
    }

    .back-web:hover {
      color: var(--zapp-cyan);
    }
  </style>
</head>

<body>
  <div class="download-card">
    <div class="logo-badge"><i class="fa-solid fa-bolt"></i></div>
    <h1>Instala <span>Zapp Store</span></h1>
    <p>Obtén la aplicación oficial de Zapp Store en tu dispositivo móvil para descargas directas en un toque.</p>

    <div class="buttons-stack">
      <a href="https://www.dropbox.com/scl/fi/yyfa4j4gs5ar47dxa2m1c/ErikAppStore.apk?rlkey=9ak39xis6gjgxapscf461sbwc&st=fct0nvbs&dl=1"
        class="boton android">
        <i class="fa-brands fa-android" style="font-size: 24px;"></i>
        Descargar para Android (APK)
      </a>

      <a href="https://www.dropbox.com/scl/fi/cinqkbqbs6pb9t0gfz28y/INSTALAR-ERIK-APP-STORE-EN-IPHONE-O-IPAD.pdf?rlkey=7k76zzjt76u3b8epu60y40zg2&st=bhjjodl6&dl=1"
        class="boton apple">
        <i class="fa-brands fa-apple" style="font-size: 24px;"></i>
        Guía de Instalación iOS (iPhone / iPad)
      </a>
    </div>

    <a href="inicio.html" class="back-web"><i class="fa-solid fa-bolt"></i> Abrir Zapp Store Web</a>
  </div>
</body>

</html>
