<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06070f">
  <title>404 — Página no encontrada | Zapp Store</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-base: #06070f;
      --card-bg: rgba(16, 19, 38, 0.85);
      --border-subtle: rgba(139, 92, 246, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --zapp-cyan: #38bdf8;
      --gradient-zapp: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #06b6d4 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background-image: radial-gradient(circle at 50% 25%, rgba(139, 92, 246, 0.22), transparent 55%);
    }

    .error-card {
      max-width: 520px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 28px;
      padding: 40px 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    }

    .code-badge {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 64px;
      font-weight: 700;
      background: var(--gradient-zapp);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px;
      margin-bottom: 10px;
    }

    p {
      color: var(--text-muted);
      font-size: 15px;
      margin-bottom: 24px;
    }

    .search-container {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .search-container input {
      flex: 1;
      padding: 13px 16px;
      border-radius: 14px;
      border: 1px solid var(--border-subtle);
      background: rgba(10, 12, 24, 0.9);
      color: var(--text-main);
      outline: none;
    }

    .search-container button,
    .home-btn {
      padding: 13px 20px;
      border-radius: 14px;
      border: none;
      background: var(--gradient-zapp);
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>

<body>
  <div class="error-card">
    <div class="code-badge">404</div>
    <h1>Ruta no encontrada en Zapp Store</h1>
    <p>Parece que este enlace cambió de ubicación o la aplicación está en el catálogo principal.</p>

    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Buscar Zapp..." aria-label="Buscar aplicaciones">
      <button onclick="searchApp()"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>

    <a href="/inicio.html" class="home-btn"><i class="fa-solid fa-bolt"></i> Volver a Zapp Store</a>
  </div>

  <script>
    function searchApp() {
      const query = document.getElementById('searchInput').value.trim();
      if (query) {
        window.location.href = '/search/' + query + '.html';
      } else {
        window.location.href = '/inicio.html';
      }
    }
  </script>
</body>

</html>
