<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b08">
  <title>404 — Página no encontrada | Kiwi Store</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-color: #070b08;
      --card-bg: rgba(18, 28, 21, 0.82);
      --card-border: rgba(163, 230, 53, 0.22);
      --text-main: #f4f9f4;
      --text-muted: #93a898;
      --accent: #a3e635;
      --accent-dark: #071209;
      --gradient-kiwi: linear-gradient(135deg, #a3e635 0%, #22c55e 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background-image: radial-gradient(circle at 50% 25%, rgba(163, 230, 53, 0.16), transparent 55%);
    }

    .error-card {
      max-width: 520px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 40px 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    }

    .code-badge {
      font-family: 'Outfit', sans-serif;
      font-size: 64px;
      font-weight: 800;
      background: var(--gradient-kiwi);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      margin-bottom: 10px;
    }

    p {
      color: var(--text-muted);
      font-size: 15px;
      margin-bottom: 24px;
    }

    .search-container {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .search-container input {
      flex: 1;
      padding: 13px 16px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      background: rgba(10, 16, 12, 0.9);
      color: var(--text-main);
      outline: none;
    }

    .search-container button,
    .home-btn {
      padding: 13px 20px;
      border-radius: 14px;
      border: none;
      background: var(--gradient-kiwi);
      color: var(--accent-dark);
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>

<body>
  <div class="error-card">
    <div class="code-badge">404</div>
    <h1>Página no encontrada en Kiwi Store</h1>
    <p>Parece que este enlace se ha movido o la aplicación que buscas está en el catálogo principal.</p>

    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Buscar aplicación..." aria-label="Buscar aplicaciones">
      <button onclick="searchApp()"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>

    <a href="/inicio.html" class="home-btn"><i class="fa-solid fa-compass"></i> Ir al Inicio de Kiwi Store</a>
  </div>

  <script>
    function searchApp() {
      const query = document.getElementById('searchInput').value.trim();
      if (query) {
        window.location.href = '/search/' + query + '.html';
      } else {
        window.location.href = '/inicio.html';
      }
    }
  </script>
</body>

</html>
