<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="google-adsense-account" content="ca-pub-6925115608826156">
  <meta name="theme-color" content="#06070f">
  <title>Zapp Store ⚡ ErikAI</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%230d0f24'/><path d='M56 14L24 56h24l-6 30 34-42H52l4-30z' fill='%2338bdf8'/></svg>"
    type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-base: #06070f;
      --card-bg: rgba(16, 19, 38, 0.85);
      --border-subtle: rgba(139, 92, 246, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --zapp-cyan: #38bdf8;
      --gradient-zapp: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #06b6d4 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body,
    html {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 100px;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      background: rgba(6, 7, 15, 0.88);
      backdrop-filter: blur(20px);
      color: var(--text-main);
      padding: 16px 24px;
      font-size: 22px;
      font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-subtle);
    }

    header span {
      background: linear-gradient(90deg, #38bdf8, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .search-bar {
      max-width: 720px;
      margin: 20px auto;
      padding: 0 20px;
      position: relative;
    }

    .search-bar input[type="search"] {
      width: 100%;
      padding: 14px 44px 14px 18px;
      border-radius: 16px;
      border: 1px solid var(--border-subtle);
      background-color: var(--card-bg);
      color: var(--text-main);
      font-size: 16px;
      outline: none;
    }

    .search-bar .fa-magnifying-glass {
      position: absolute;
      right: 36px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--zapp-cyan);
      font-size: 18px;
    }

    .apps-container {
      max-width: 720px;
      margin: 0 auto 80px auto;
      padding: 0 20px;
    }

    .mini-blog {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    .mini-blog h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 22px;
      color: var(--zapp-cyan);
      margin-bottom: 14px;
    }

    .app-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
    }

    .app-card img {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      object-fit: cover;
    }

    .app-info {
      flex: 1;
    }

    .app-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 4px;
    }

    .app-desc {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .download-btn {
      display: inline-block;
      background: var(--gradient-zapp);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 9px 20px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    nav.bottom-nav {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 440px;
      height: 68px;
      background: rgba(10, 12, 26, 0.9);
      backdrop-filter: blur(22px);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 200;
    }

    nav.bottom-nav button,
    nav.bottom-nav a {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    nav.bottom-nav .active {
      color: var(--zapp-cyan);
    }

    nav.bottom-nav i {
      font-size: 19px;
      margin-bottom: 4px;
    }
  </style>
</head>

<body>
  <header>⚡ Zapp <span>Store</span></header>

  <div class="search-bar">
    <input type="search" id="searchInput" placeholder="Buscar en Zapp Store..." aria-label="Buscar aplicaciones" />
    <i class="fa fa-magnifying-glass"></i>
  </div>

  <div class="apps-container" id="appsContainer">
    <section class="mini-blog" data-category="destacadas">
      <h2>⚡ Inteligencia Artificial Destacada</h2>
      <div class="app-card" data-name="Erik AI">
        <img src="https://erikai.vercel.app/source/New%20logo%20in%20ErikAi.gif" alt="Erik AI" />
        <div class="app-info">
          <p class="app-title">ErikAI (Compatible con iOS &amp; Android)</p>
          <p class="app-desc">Asistente de inteligencia artificial integrado en el ecosistema Zapp Store para ayudarte en tus tareas diarias.</p>
          <a href="https://erikappstore.vercel.app/apptwo/api/erikai/erikai.html" class="download-btn" target="_blank"
            rel="noopener"><i class="fa-solid fa-bolt"></i> Instalar Ahora</a>
        </div>
      </div>
    </section>
  </div>

  <nav class="bottom-nav" role="navigation" aria-label="Barra de navegación principal">
    <a href="inicio.html" id="navInicio" class="active" aria-label="Inicio">
      <i class="fa-solid fa-bolt"></i>
      <span>Zapp Home</span>
    </a>
    <button id="navBuscar" aria-label="Buscar">
      <i class="fa-solid fa-magnifying-glass"></i>
      <span>Buscar</span>
    </button>
    <a href="library.html" id="navBiblioteca" aria-label="Vault">
      <i class="fa-solid fa-vault"></i>
      <span>Vault</span>
    </a>
  </nav>

  <script>
    const searchInput = document.getElementById('searchInput');
    const appsContainer = document.getElementById('appsContainer');
    const miniBlogs = appsContainer.querySelectorAll('.mini-blog');

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.toLowerCase().trim();
      miniBlogs.forEach(blog => {
        let anyVisible = false;
        const appCards = blog.querySelectorAll('.app-card');
        appCards.forEach(card => {
          const name = card.getAttribute('data-name').toLowerCase();
          if (name.includes(query)) {
            card.style.display = 'flex';
            anyVisible = true;
          } else {
            card.style.display = 'none';
          }
        });
        blog.style.display = anyVisible ? 'block' : 'none';
      });
    });

    document.getElementById('navBuscar').addEventListener('click', () => {
      searchInput.focus();
    });
  </script>
</body>

</html>
