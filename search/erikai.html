<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zapp Store ⚡ Erik AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-base: #06070f;
      --card-bg: rgba(16, 19, 38, 0.85);
      --border-subtle: rgba(139, 92, 246, 0.25);
      --text-main: #f8fafc;
      --gradient-zapp: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #06b6d4 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
    }

    header {
      background: rgba(6, 7, 15, 0.9);
      border-bottom: 1px solid var(--border-subtle);
      padding: 18px 24px;
      text-align: center;
      font-family: 'Space Grotesk', sans-serif;
    }

    .container {
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 28px;
      width: 280px;
      text-align: center;
    }

    .app-card img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      margin-bottom: 14px;
    }

    .app-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .download-btn {
      display: inline-block;
      width: 100%;
      background: var(--gradient-zapp);
      color: #fff;
      font-weight: 700;
      border-radius: 12px;
      padding: 12px 20px;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <header>
    <h1>⚡ Zapp Store — Búsqueda</h1>
  </header>
  <div class="container">
    <div class="app-card">
      <img
        src="https://cdn.glitch.global/647fd858-f0a6-4652-b1c7-40ab5ea1e6bc/erik-ia-animation-more-visual-unscreen.gif?v=1744748575452"
        alt="Erik AI">
      <div class="app-title">Erik AI</div>
      <a href="https://erikappstore.vercel.app/apptwo/api/erikai/erikai.html" class="download-btn">Instalar</a>
    </div>
  </div>
</body>

</html>
