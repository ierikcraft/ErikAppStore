<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiwi Store Windows — OS Simulation Project</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-color: #070b08;
      --card-bg: rgba(18, 28, 21, 0.85);
      --card-border: rgba(163, 230, 53, 0.24);
      --text-main: #f4f9f4;
      --accent-dark: #071209;
      --gradient-kiwi: linear-gradient(135deg, #a3e635 0%, #22c55e 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
    }

    header {
      background: rgba(7, 11, 8, 0.9);
      border-bottom: 1px solid var(--card-border);
      padding: 18px 24px;
      text-align: center;
      font-family: 'Outfit', sans-serif;
    }

    .container {
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 28px;
      width: 280px;
      text-align: center;
    }

    .app-card img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      margin-bottom: 14px;
      object-fit: cover;
    }

    .app-title {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .download-btn {
      display: inline-block;
      width: 100%;
      background: var(--gradient-kiwi);
      color: var(--accent-dark);
      font-weight: 700;
      border-radius: 99px;
      padding: 12px 20px;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <header>
    <h1>🥝 Kiwi Store para Windows — OS Simulation</h1>
  </header>
  <div class="container">
    <div class="app-card">
      <img
        src="https://static.vecteezy.com/system/resources/previews/021/496/368/non_2x/ios-icon-logo-software-phone-apple-symbol-with-name-black-design-mobile-illustration-free-vector.jpg"
        alt="iOS Simulator">
      <div class="app-title">iOS Simulator</div>
      <a href="OSsim2.html" class="download-btn">Abrir Proyecto</a>
    </div>
  </div>
</body>

</html>
