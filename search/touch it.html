<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zapp Store Windows ⚡ Touch IT</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-base: #06070f;
      --card-bg: rgba(16, 19, 38, 0.85);
      --border-subtle: rgba(139, 92, 246, 0.25);
      --text-main: #f8fafc;
      --gradient-zapp: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #06b6d4 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
    }

    header {
      background: rgba(6, 7, 15, 0.9);
      border-bottom: 1px solid var(--border-subtle);
      padding: 18px 24px;
      text-align: center;
      font-family: 'Space Grotesk', sans-serif;
    }

    .container {
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 28px;
      width: 280px;
      text-align: center;
    }

    .app-card img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      margin-bottom: 14px;
      object-fit: cover;
    }

    .app-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .download-btn {
      display: inline-block;
      width: 100%;
      background: var(--gradient-zapp);
      color: #fff;
      font-weight: 700;
      border-radius: 12px;
      padding: 12px 20px;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <header>
    <h1>⚡ Zapp Store para Windows — Touch IT</h1>
  </header>
  <div class="container">
    <div class="app-card">
      <img
        src="https://cdn.glitch.global/22db19f6-a3d5-4c98-9b1a-836a8b7e2db2/Icono%20cuadrado.png?v=1740505973552"
        alt="Touch IT - Be fast!">
      <div class="app-title">Touch IT - Be fast!</div>
      <a href="https://download1507.mediafire.com/3kxzdb77ersgofaD1lMAHIaNK3z-xJR4mTGY3vTdZHIM_fa6a6t98ftwLZZJfD_2BRAU3Qiag8BElkI1aOXNFRE56fCsThymxRH1bS0YoJxmP3RAWksTjR6qk4qMiOsJUh5GNc0aCfL4JVYf1lkXpm_CTw9NtjSOW_R17L6m754/l3nxjwaq92f6vke/Touch-IT+-+BETA.zip"
        class="download-btn">Descargar BETA</a>
    </div>
  </div>
</body>

</html>
